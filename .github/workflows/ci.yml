# Everything CONTRIBUTING.md says to run, on every push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit tests and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      # The extension runs the language server from this repo's source.
      - run: npm ci
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run typecheck
        working-directory: editors/vscode
      - run: xvfb-run -a npm test
        working-directory: editors/vscode
